<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAD DARŚANA: THE GOLDEN WISDOM QUEST</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy-deep: #0A1128;
            --navy-card: #101C3F;
            --royal-blue: #1E3A8A;
            --gold-champagne: #D4AF37;
            --gold-light: #F3E5AB;
            --gold-gradient: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
            --ivory-warm: #F8FAFC;
            --text-muted: #94A3B8;
            --success-green: #10B981;
            --error-red: #EF4444;
            --border-gold: rgba(212, 175, 55, 0.35);
            --shadow-gold: 0 0 25px rgba(212, 175, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--navy-deep);
            color: var(--ivory-warm);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        h1, h2, h3, h4, .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* HEADER & NAVIGATION BAR */
        header {
            background: rgba(10, 17, 40, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-gold);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .brand-logo i {
            color: var(--gold-champagne);
            font-size: 1.6rem;
        }

        .brand-title {
            font-size: 1.1rem;
            color: var(--gold-champagne);
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .ctrl-btn {
            background: transparent;
            border: 1px solid var(--border-gold);
            color: var(--gold-champagne);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .ctrl-btn:hover {
            background: rgba(212, 175, 55, 0.15);
        }

        .progress-box {
            font-size: 0.8rem;
            color: var(--gold-light);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        /* LAYOUT CONTAINER */
        main {
            flex: 1;
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* VIEWS SYSTEM VIA HTML hidden ATTRIBUTE */
        .view-section {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .view-section[hidden] {
            display: none !important;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* CARDS & GLASSMORPHISM */
        .card {
            background: var(--navy-card);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: var(--shadow-gold);
        }

        /* BUTTONS */
        .btn-gold {
            background: var(--gold-gradient);
            color: var(--navy-deep);
            border: none;
            padding: 12px 26px;
            border-radius: 30px;
            font-weight: 700;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 10px 22px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-outline:hover {
            background: rgba(212, 175, 55, 0.1);
        }

        /* MASCOT DIALOGUE PANEL */
        .mascot-box {
            display: flex;
            align-items: center;
            gap: 18px;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.5) 0%, rgba(16, 28, 63, 0.9) 100%);
            border: 1px solid var(--border-gold);
            border-radius: 16px;
            padding: 1.2rem 1.5rem;
        }

        .mascot-avatar-container {
            width: 70px;
            height: 70px;
            flex-shrink: 0;
            position: relative;
        }

        .svg-mascot {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 8px rgba(212, 175, 55, 0.4));
            animation: floatMascot 3s ease-in-out infinite;
        }

        @keyframes floatMascot {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .mascot-dialogue {
            flex: 1;
        }

        .mascot-name {
            font-size: 0.85rem;
            color: var(--gold-champagne);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .mascot-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--ivory-warm);
        }

        /* HERO HOME VIEW */
        .hero-box {
            text-align: center;
            padding: 2.5rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
        }

        .badge-tag {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-champagne);
            color: var(--gold-champagne);
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .hero-title {
            font-size: 2.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFFFFF 20%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.25;
        }

        .hero-sub {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 650px;
            line-height: 1.6;
        }

        /* NAVIGATION GRID MENU */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.2rem;
        }

        .menu-item {
            background: var(--navy-card);
            border: 1px solid var(--border-gold);
            border-radius: 14px;
            padding: 1.5rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item:hover {
            transform: translateY(-4px);
            border-color: var(--gold-champagne);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.25);
            background: rgba(30, 58, 138, 0.4);
        }

        .menu-item i {
            font-size: 1.8rem;
            color: var(--gold-champagne);
        }

        .menu-item h3 {
            font-size: 1.1rem;
            color: var(--ivory-warm);
        }

        .menu-item p {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* SAD DARSANA MAP GRID */
        .darshana-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
        }
